<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de Entrada</title>
</head>

<body>
    <div>
        <!-- Input del texto simple -->
        <label for="nombre">Nombre Completo: </label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo">
        <br><br>

        <!-- Input de numero -->
        <label for="numero">Numero: </label>
        <input type="number" id="numero" name="numero" min="0" max="100" value="50" step="1">
        <br><br>

        <!-- Input de Rango -->
        <label for="rango">Rango: </label>
        <input type="range" id="rango" name="rango" min="0" max="100" value="50" step="1">
        <br><br>

        <!-- Input de Correo -->
        <label for="correo">Correo Electrónico: </label>
        <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo electrónico">
        <br><br>

        <!-- Input de Password -->
        <label for="password">Contraseña: </label>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
        <br><br>

        <!-- Input de Fecha -->
        <label for="fecha">Fecha: </label>
        <input type="date" id="fecha" name="fecha">
        <br><br>

        <!-- Input de checkbox -->
        <label for="activo">Acepto: </label>
        <input type="checkbox" id="checkbox" name="checkbox" value="1">
        <br><br>

        <!-- Input de archivo -->
        <label for="archivo">Selecciona tu archivo: </label>
        <input type="file" id="archivo" name="mi_archivo">
        <br><br>

        <!-- Input de Color -->
        <label for="color">Selecciona un color: </label>
        <input type="color" id="color" name="color" value="violet">
        <br><br>

        <!-- Input de Hiden -->
        <label for="oculto">Campo Oculto: </label>
        <input type="hidden" id="oculto" name="usuario_1" value="123">
        <br><br>

    </div>
</body>

</html>
